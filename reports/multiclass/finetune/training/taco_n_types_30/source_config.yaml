# Real TACO labels merged into bottle, bag and can. Separate from UAVVaste runs.
name: taco_n_types_30
model: yolov8n.pt
data: data/processed/taco_types/data.yaml
seed: 42
train:
  epochs: 30
  imgsz: 640
  batch: 4
  workers: 0
  patience: 15
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  close_mosaic: 5
  fraction: 1.0
  cache: false
  amp: false
augmentation:
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
