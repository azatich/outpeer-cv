# Conservative alternative chosen from validation behavior, never test results.
# Start from the original three-class best.pt, not the first fine-tuning attempt.
name: taco_n_types_finetune_careful_30
model: models/b/taco_n_types_30/best.pt
data: data/processed/taco_types/data.yaml
seed: 42
train:
  epochs: 30
  imgsz: 640
  batch: 8
  workers: 0
  patience: 10
  optimizer: AdamW
  lr0: 0.00005
  lrf: 0.1
  weight_decay: 0.0005
  warmup_epochs: 0.0
  cos_lr: true
  close_mosaic: 10
  fraction: 1.0
  cache: false
  amp: false
augmentation:
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.2
  mixup: 0.0
