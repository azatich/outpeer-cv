# Compared with baseline, only the name, rotation and vertical flipping change.
name: a_n_aug
model: yolov8n.pt
data: data/processed/uavvaste/data.yaml
seed: 42
train:
  epochs: 50
  imgsz: 640
  batch: 4
  workers: 0
  patience: 15
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  close_mosaic: 10
  fraction: 1.0
  cache: ram  # Match baseline input caching.
  amp: false  # Keep the same precision as baseline on GTX 1650.
augmentation:
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3
  degrees: 180.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
